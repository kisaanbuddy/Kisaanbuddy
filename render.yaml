# Render.com Blueprint — auto-detected on git push.
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting this repo on render.com:
#   1. Render creates the service from this file (free tier, Oregon region)
#   2. Set secret env vars in Render Dashboard → service → Environment:
#      JWT_SECRET, DATABASE_URL, OPENAI_API_KEY, GEMINI_API_KEY, etc.
#   3. Push to main → Render rebuilds + redeploys automatically

services:
  - type: web
    name: krishiai-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: "pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: '["https://kisaanbuddy.com","https://www.kisaanbuddy.com","https://krishiai.vercel.app"]'
      - key: ALLOWED_ORIGIN_REGEX
        value: '^https:\/\/.*\.vercel\.app$'
      - key: DATABASE_URL
        sync: false   # set in dashboard (PostgreSQL connection string)
      - key: JWT_SECRET
        sync: false   # REQUIRED: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: CROP_DOCTOR_MODEL_PATH
        value: "ml/crop_doctor/artifacts/experiments/exp_c2_efficientnet_b0_pretrained_224/best_model.pth"
      - key: CROP_DOCTOR_DEVICE
        value: "cpu"
      - key: CROP_DOCTOR_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: CROP_DOCTOR_TEMPERATURE
        value: "1.0500"
      - key: STORAGE_BACKEND
        value: "mounted"
      - key: PILOT_STORAGE_PATH
        value: "uploads/pilot_images"
      - key: OPENWEATHERMAP_API_KEY
        sync: false   # set in dashboard
      - key: OPENAI_API_KEY
        sync: false   # set in dashboard
      - key: OPENAI_BASE_URL
        sync: false   # set in dashboard (optional)
      - key: OPENAI_CHAT_MODEL
        sync: false   # set in dashboard (optional)
      - key: GEMINI_API_KEY
        sync: false   # set in dashboard
      - key: SARVAM_API_KEY
        sync: false   # set in dashboard (optional)
      - key: OTP_PROVIDER
        value: "2factor"
      - key: TWOFACTOR_API_KEY
        value: "3dee1f51-ace8-11f1-90d7-0200cd936042"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_APP_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        value: "v21.0"
      - key: WHATSAPP_SIGNATURE_VERIFICATION
        value: "true"
      - key: WHATSAPP_TEST_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEST_ACCESS_TOKEN
        sync: false
