version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kisaanbuddy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kisaanbuddy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kisaanbuddy_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kisaanbuddy_api
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/kisaanbuddy_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: kisaanbuddy_production_secret_key_change_me_in_real_env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kisaanbuddy_worker
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/kisaanbuddy_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: kisaanbuddy_production_secret_key_change_me_in_real_env
    depends_on:
      - postgres
      - redis
    command: python -m services.worker

volumes:
  postgres_data:
  redis_data:
